<div class="performance-card">
    <div class="performance-header">
        <h5>{{ performance.performer.name }}</h5>
        <div class="buttons">
            {% comment %}
            <button class="small white padding-1"><i class="fa-regular fa-calendar"></i></button>
            {% endcomment %}
            <button 
                class="small white padding-1"
                {% if itinerary_id %}
                    hx-post="{% url 'remove_performance_shared' itinerary_id %}"
                {% else %}
                    hx-post="{% url 'remove_performance' %}"
                {% endif %}
                hx-trigger="click"
                hx-vals='{"performance_id": "{{ performance.id }}"}'
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-target="#itinerary_sidebar"
                hx-swap="outerHTML"
            ><i class="fa-regular fa-trash-can"></i></button>
        </div>
    </div>
    <div class="performance-body">
        <p>
            <small>
                <i class="fa-regular fa-clock"></i> {{ performance.start_time }} - {{ performance.end_time }}
            </small>
        </p>
        <div class="genres">
            {% for genre in performance.performer.genres.all %}
                <span class="chip">{{ genre.name }}</span>
            {% endfor %}
        </div>
        <p>
            <small class="display-flex gutter-3">
                <a href="{% url 'map' %}?porch={{ performance.porch.slug }}" class="text-left grow-1">
                    <i class="fa-solid fa-location-pin"></i>
                    {{ performance.porch.name }}<br>
                    {{ performance.porch.street_address }}
                </a>
                <a href="https://www.google.com/maps/dir/?api=1&destination={{ performance.porch.street_address|urlencode }}">
                    <i class="google-maps small"></i>
                </a>
                <a href="https://maps.apple.com/?q={{ performance.porch.street_address|urlencode }}">
                    <i class="apple-maps small"></i>
                </a>
            </small>
        </p>
    </div>
</div>
